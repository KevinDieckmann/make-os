<!doctype html><html lang="de"><head><meta charset="utf-8"><title>MAKE OS Logo — Runde 2</title><link rel="stylesheet" href="../../css/ci.css"><style>body{background:var(--grund);color:var(--ink);font-family:var(--schrift-text);padding:32px;display:grid;gap:28px}h1{font-family:var(--schrift-display);font-size:var(--titel)}.reihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}figure{margin:0;background:var(--flaeche);border-radius:16px;padding:18px;display:grid;gap:10px;justify-items:center}figure.wahl{outline:2px solid var(--aktiv)}figcaption{color:var(--inkDim);font-size:13px;text-align:center}.hell{background:#F4F5F5;border-radius:12px;padding:8px}</style></head><body><h1>MAKE OS — Logo, Runde 2 (Kevin: „Logo noch nicht so“)</h1><div class="reihe"><figure><img src="v2/entwurf-E.svg" width="150" alt="Entwurf E"><figcaption><b>E</b> · MK-Monogramm: M und K teilen sich den Stamm, der untere K-Arm in Türkis.</figcaption></figure><figure class="wahl"><img src="v2/entwurf-F.svg" width="150" alt="Entwurf F"><figcaption><b>F</b> · Zwei Hälften werden ein M: MA (hell) und KE (türkis) treffen sich in der Fuge. Gewählt — die Wortmarke folgt derselben Teilung. Seit dem dritten Durchgang tragen die Hälften die Personenfarben: MA Granat (Malin), KE Smaragd (Kevin).</figcaption></figure><figure><img src="v2/entwurf-G.svg" width="150" alt="Entwurf G"><figcaption><b>G</b> · Block-M mit Kernpunkt.</figcaption></figure><figure><img src="v2/entwurf-H.svg" width="150" alt="Entwurf H"><figcaption><b>H</b> · Zwei Säulen, ein Bogen, ein Kern — ohne Buchstabe.</figcaption></figure><figure><img src="v2/entwurf-I.svg" width="150" alt="Entwurf I"><figcaption><b>I</b> · M, aus dessen Scheitel ein K-Arm wächst.</figcaption></figure></div><h1>Anwendung F</h1><div class="reihe"><figure><img src="logo-app.svg" width="150" alt="App-Icon"><figcaption>App-Icon · Favicon</figcaption></figure><figure><img src="wortmarke.svg" style="width:100%" alt="Wortmarke"><figcaption>Wortmarke: Buchstaben weiß, Granat-Strich unter MA, Smaragd-Strich unter KE, OS leise</figcaption></figure><figure><div class="hell"><img src="logo-hell.svg" width="120" alt="auf hell"></div><figcaption>auf hellem Grund</figcaption></figure><figure><img src="logo-mono.svg" width="150" alt="einfarbig"><figcaption>einfarbig (Druck, Stempel)</figcaption></figure></div></body></html>
