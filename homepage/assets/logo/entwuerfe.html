<!doctype html><html lang='de'><head><meta charset='utf-8'><title>MAKE OS Logo-Entwürfe</title><link rel='stylesheet' href='../../css/ci.css'><style>body{background:var(--grund);color:var(--ink);font-family:var(--schrift-text);padding:32px;display:grid;gap:32px}h1{font-family:var(--schrift-display);font-size:var(--titel)}.reihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px}figure{margin:0;background:var(--flaeche);border-radius:var(--r-behaelter);padding:20px;display:grid;gap:12px}figcaption{color:var(--inkDim);font-size:var(--bedien)}.hell{background:#F4F5F5}</style></head><body><h1>MAKE OS — vier Logo-Entwürfe</h1><div class='reihe'><figure><img src='entwurf-A.svg' width='160' alt='Entwurf A'><img src='wortmarke-A.svg' style='width:100%' alt='Wortmarke A'><figcaption>A · Zwei Striche werden ein M — Malin links, Kevin rechts; der Kern (türkis) ist das System.</figcaption></figure><figure><img src='entwurf-B.svg' width='160' alt='Entwurf B'><img src='wortmarke-B.svg' style='width:100%' alt='Wortmarke B'><figcaption>B · Dasselbe M, der Kern als Score-Ring — die eine Zahl, an der sich alles misst.</figcaption></figure><figure><img src='entwurf-C.svg' width='160' alt='Entwurf C'><img src='wortmarke-C.svg' style='width:100%' alt='Wortmarke C'><figcaption>C · M und K in einer Form: aus dem M bricht das K (türkis) heraus — zwei Namen, ein Zeichen.</figcaption></figure><figure><img src='entwurf-D.svg' width='160' alt='Entwurf D'><img src='wortmarke-D.svg' style='width:100%' alt='Wortmarke D'><figcaption>D · Das M als Puls-Linie im Ring — Leben und System; ruhigste Variante.</figcaption></figure></div></body></html>
