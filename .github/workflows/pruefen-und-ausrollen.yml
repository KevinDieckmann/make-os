# ─── MAKE OS · Prüfen und ausrollen ─────────────────────────────────────────
# Jeder Push auf main: Typen, Tests, Lint. Nur wenn alles grün ist, löst
# GitHub auf dem Server das Ausrollen aus: der Server zieht den Stand, das
# Bild wird auf GitHub gebaut und fertig hingeschickt (seit 26.09. abends —
# vorher baute der 1-CPU-Server selbst und war dabei 10 Minuten kaum benutzbar). Seit 25.09. (Härtung):
#   · Der Schlüssel darf auf dem Server NUR diesen einen Befehl auslösen
#     (authorized_keys: command=…,restrict) — keine Konsole, kein Kopieren.
#   · Der Server wird an seinem festen Fingerabdruck erkannt (kein
#     „erster Kontakt vertraut allem“).
#   · Nie zwei Auslieferungen gleichzeitig.
# Geheimnisse im Repo (Settings → Secrets and variables → Actions):
#   MAKE_OS_HOST     — Server-IP (2.28.108.162)
#   MAKE_OS_SSH_KEY  — privater Ausroll-Schlüssel (~/.ssh/make-os-ausrollen auf Kevins Mac)
name: Prüfen und ausrollen
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ausrollen
  cancel-in-progress: false

# Die Action braucht nur Lesen (26.09.) — kein Schreiben ins Repo, keine Pakete.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npx next lint

  # Sicherheitsstufe (27.09., HOI-Recherche A6): Abhängigkeiten, Geheimnisse, tote Dateien —
  # parallel zum Prüfen und in der ersten Zeit NICHT blockierend (continue-on-error), damit ein
  # neuer Befund das Ausrollen nicht anhält, bevor jemand ihn gesehen hat. Ergebnis im Lauf-Protokoll.
  sicherheit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Abhängigkeiten mit bekannten Lücken (hoch/kritisch)
        run: npm audit --omit=dev --audit-level=high || (echo "::warning::npm audit meldet Lücken — siehe oben"; exit 1)
      - name: Geheimnisse im Verlauf (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ungenutzte Dateien, Exporte und Pakete (knip)
        run: npx --yes knip --reporter compact || (echo "::warning::knip meldet Ungenutztes — siehe oben"; exit 1)

  ausrollen:
    needs: pruefen
    # 04.11.: fest auf 24.04 — seit dem Umzug von ubuntu-latest (Ubuntu 26) kam am Server nur ein abgeschnittenes Bild an.
    runs-on: ubuntu-24.04
    if: ${{ vars.AUSROLLEN != 'aus' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Seit 26.09. abends: Das Bild entsteht HIER, nicht auf dem 1-CPU-Server (der war beim Bauen 10 Minuten kaum benutzbar).
      # 02.11.: Instanz-Einstellungen (Zuordnung je Einheit, CRM-Team, Event-Marke) kommen als Repository-Variablen an den Bau.
      # Fehlt eine Variable, ist das Argument leer = Verhalten wie bisher. Der Prüf-Schritt läuft ohne sie.
      # Ausnahme (Kevin 02.11.): die Zuordnung „Selbstständigkeit = Business“ steht als Vorgabe UNSERER Instanz hier (wie Server-Adresse
      # und Host-Schlüssel unten) — eine gesetzte Variable MAKE_OS_EINHEITEN gewinnt. Eine andere Instanz nimmt diese Zeile heraus.
      - name: Bild bauen
        env:
          EINHEITEN: ${{ vars.MAKE_OS_EINHEITEN }}
          CRM_TEAM: ${{ vars.MAKE_OS_CRM_TEAM }}
          EVENT_MARKE: ${{ vars.MAKE_OS_EVENT_MARKE }}
        run: |
          EINHEITEN_VORGABE='{"kdc":{"bereich":"business"}}'
          [ -n "$EINHEITEN" ] || EINHEITEN="$EINHEITEN_VORGABE"
          # --provenance/--sbom aus: Anhänge ohne Inhalt lassen `docker save` mit dem containerd-Speicher scheitern.
          docker build --pull --provenance=false --sbom=false \
            --build-arg NEXT_PUBLIC_MAKE_OS_EINHEITEN="$EINHEITEN" \
            --build-arg NEXT_PUBLIC_MAKE_OS_CRM_TEAM="$CRM_TEAM" \
            --build-arg NEXT_PUBLIC_MAKE_OS_EVENT_MARKE="$EVENT_MARKE" \
            -t make-os:aktuell .
      - name: Server zieht den Stand und bekommt das Bild
        env:
          HOST: ${{ secrets.MAKE_OS_HOST }}
          KEY: ${{ secrets.MAKE_OS_SSH_KEY }}
        run: |
          [ -n "$HOST" ] && [ -n "$KEY" ] || { echo "Noch kein Server hinterlegt — nur geprüft."; exit 0; }
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          # Fester Fingerabdruck des Servers (Hetzner, 25.09.) — bei einem neuen Server hier eintragen.
          echo "2.28.108.162 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFzA26Sov+ko5Jhl02nX7Luik4N1wYVaEjl8ouH5FFNQ" > ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes -o BatchMode=yes make@$HOST"
          # Ziehen bis zu 3× (ein Aussetzer bei GitHub am Server gab am 04.11. git-Fehler 128); die Meldung steht im Lauf.
          for VERSUCH in 1 2 3; do
            if AUSGABE="$($SSH ziehen </dev/null 2>&1)"; then break; fi
            echo "::warning::ziehen Versuch $VERSUCH: $(echo "$AUSGABE" | tail -3 | tr '\n' ' ' | cut -c1-400)"
            [ "$VERSUCH" = 3 ] && { echo "::error::ziehen gescheitert: $(echo "$AUSGABE" | tail -3 | tr '\n' ' ' | cut -c1-400)"; exit 1; }
            sleep 20
          done
          echo "$AUSGABE"
          if echo "$AUSGABE" | grep -q "ausrollen-v2"; then
            # Erst in eine Datei und prüfen, dann schicken — ein Fehler steht so als Meldung im Lauf (nicht nur „exit 1“).
            set -o pipefail
            # Platz auf dem GitHub-Rechner: `docker save` braucht Raum neben dem Bild (04.11.: nur 4 KB kamen heraus).
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
            docker builder prune -af >/dev/null 2>&1 || true
            echo "▸ frei auf dem Rechner: $(df -h / | awk 'NR==2{print $4}')"
            if ! docker save make-os:aktuell 2>/tmp/save.err | gzip -1 > /tmp/bild.tar.gz || ! gzip -t /tmp/bild.tar.gz \
               || [ "$(stat -c %s /tmp/bild.tar.gz)" -lt 50000000 ]; then
              echo "::error::docker save gescheitert ($(du -h /tmp/bild.tar.gz | cut -f1), frei $(df -h / | awk 'NR==2{print $4}')): $(tr '\n' ' ' < /tmp/save.err | cut -c1-500)"
              docker images make-os; exit 1
            fi
            echo "▸ Bild zum Server schicken ($(du -h /tmp/bild.tar.gz | cut -f1))"
            if ! $SSH bild < /tmp/bild.tar.gz > /tmp/server.txt 2>&1; then
              cat /tmp/server.txt; echo "::error::Server: $(tail -3 /tmp/server.txt | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            cat /tmp/server.txt
          else
            echo "▸ Server hat noch das alte Skript — dort wurde gezogen und gebaut."
          fi
