# ─── MAKE OS · Prüfen und ausrollen ─────────────────────────────────────────
# Jeder Push auf main: Typen, Tests, Lint. Nur wenn alles grün ist, löst
# GitHub auf dem Server das Ausrollen aus: der Server zieht den Stand, das
# Bild wird auf GitHub gebaut und fertig hingeschickt (seit 26.09. abends —
# vorher baute der 1-CPU-Server selbst und war dabei 10 Minuten kaum benutzbar). Seit 25.09. (Härtung):
#   · Der Schlüssel darf auf dem Server NUR diesen einen Befehl auslösen
#     (authorized_keys: command=…,restrict) — keine Konsole, kein Kopieren.
#   · Der Server wird an seinem festen Fingerabdruck erkannt (kein
#     „erster Kontakt vertraut allem“).
#   · Nie zwei Auslieferungen gleichzeitig.
# Geheimnisse im Repo (Settings → Secrets and variables → Actions):
#   MAKE_OS_HOST     — Server-IP (2.28.108.162)
#   MAKE_OS_SSH_KEY  — privater Ausroll-Schlüssel (~/.ssh/make-os-ausrollen auf Kevins Mac)
name: Prüfen und ausrollen
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ausrollen
  cancel-in-progress: false

# Die Action braucht nur Lesen (26.09.) — kein Schreiben ins Repo, keine Pakete.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npx next lint

  # Sicherheitsstufe (27.09., HOI-Recherche A6): Abhängigkeiten, Geheimnisse, tote Dateien —
  # parallel zum Prüfen und in der ersten Zeit NICHT blockierend (continue-on-error), damit ein
  # neuer Befund das Ausrollen nicht anhält, bevor jemand ihn gesehen hat. Ergebnis im Lauf-Protokoll.
  sicherheit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Abhängigkeiten mit bekannten Lücken (hoch/kritisch)
        run: npm audit --omit=dev --audit-level=high || (echo "::warning::npm audit meldet Lücken — siehe oben"; exit 1)
      - name: Geheimnisse im Verlauf (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ungenutzte Dateien, Exporte und Pakete (knip)
        run: npx --yes knip --reporter compact || (echo "::warning::knip meldet Ungenutztes — siehe oben"; exit 1)

  ausrollen:
    needs: pruefen
    runs-on: ubuntu-latest
    if: ${{ vars.AUSROLLEN != 'aus' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Seit 26.09. abends: Das Bild entsteht HIER, nicht auf dem 1-CPU-Server (der war beim Bauen 10 Minuten kaum benutzbar).
      - name: Bild bauen
        run: docker build --pull -t make-os:aktuell .
      - name: Server zieht den Stand und bekommt das Bild
        env:
          HOST: ${{ secrets.MAKE_OS_HOST }}
          KEY: ${{ secrets.MAKE_OS_SSH_KEY }}
        run: |
          [ -n "$HOST" ] && [ -n "$KEY" ] || { echo "Noch kein Server hinterlegt — nur geprüft."; exit 0; }
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          # Fester Fingerabdruck des Servers (Hetzner, 25.09.) — bei einem neuen Server hier eintragen.
          echo "2.28.108.162 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFzA26Sov+ko5Jhl02nX7Luik4N1wYVaEjl8ouH5FFNQ" > ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes -o BatchMode=yes make@$HOST"
          AUSGABE="$($SSH ziehen </dev/null)"; echo "$AUSGABE"
          if echo "$AUSGABE" | grep -q "ausrollen-v2"; then
            echo "▸ Bild zum Server schicken"
            docker save make-os:aktuell | gzip -1 | $SSH bild
          else
            echo "▸ Server hat noch das alte Skript — dort wurde gezogen und gebaut."
          fi
