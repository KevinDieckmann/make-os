<!-- MAKE Innovation · „Das Haus“: Rahmen der Bühne (QUELLE). bauen.mjs setzt ihn an den Anfang der Startseite.
     Platzhalter: {{ziel:name}} = Linkziel aus ziele.json (der Bau löst es über die Helfer der Website auf), {{szenen}} = die Szenen aus szenen.json und raeume.json,
     {{anzahl}} = ihre Zahl, {{snaps}} = die Raststellen, {{etagen}} = die Leiste der Etagen, {{wahl}} = die Liste der Etagenwahl. -->
<script src="/js/haus-frueh.js"></script>
<section id="top" class="track haus" aria-label="Das Haus: die Fahrt in {{anzahl}} Szenen">
  <svg class="haus-zeichen" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10"/><path d="M17 8v9H8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>

  <div class="snaps" aria-hidden="true">{{snaps}}</div>

  <div class="stage">
    <div class="seq" id="seqLayer">
      <canvas id="seq" aria-hidden="true"></canvas>
      <div class="seq-shade"></div>
      <div class="grain" id="grain" aria-hidden="true"></div>
    </div>

    <div class="szenen" id="szenen">
{{szenen}}
    </div>

    {{etagen}}
    <a class="ueberspringen" id="ueberspringen" href="#kurz"><span>Fahrt überspringen</span><svg aria-hidden="true"><use href="#i-close"/></svg></a>

    <!-- Übergang: der Kreis -->
    <div class="star" id="star" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#A78BFA"/><circle id="starTint" cx="12" cy="12" r="12" fill="#F6F4F0" opacity="0"/></svg>
    </div>
  </div>

  <!-- Etagenwahl: erreichbar über den Empfang -->
  <dialog class="wahl haus" id="etagenwahl" aria-labelledby="wahl-h">
    <div class="wahl-innen">
      <button type="button" class="wahl-zu" id="wahlZu" aria-label="Etagenwahl schließen"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
      <h2 class="t-caption" id="wahl-h">Wohin soll die Fahrt gehen?</h2>
      <p class="wahl-cta"><a class="alink erst" href="{{ziel:erstgespraech}}"><span class="t-caption">Erstgespräch buchen</span></a></p>
      <ol class="wahl-liste">{{wahl}}</ol>
    </div>
  </dialog>

</section>
