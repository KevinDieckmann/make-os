<title>MAKE OS · Clickdummy</title>
<style>
:root{
  --bg:#05090E; --surface:#0B1219; --surface2:#0F1922; --raised:#132430;
  --border:#1B2A33; --border-soft:#122029;
  --ink:#E8F4F0; --dim:#8CA3A6; --faint:#5C7276;
  --accent:#2BF0C0; --accent2:#38B6FF; --accent-soft:rgba(43,240,192,.10);
  --amber:#F5C15A; --red:#FF6B7A; --crit:#FF6B7A; --blue:#38B6FF; --line-hot:rgba(43,240,192,.4);
  --r:12px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#26302E;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:240px 1fr;height:100vh}

/* ── SIDEBAR ── */
.side{background:#070C12;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04120C;font-weight:800;font-size:13px}
.brand .name{font-weight:600;letter-spacing:.14em;font-size:13px}
.brand .name span{color:var(--faint);font-weight:400;font-size:10px;display:block;letter-spacing:.18em}
.navlabel{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;padding:14px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;color:var(--dim);font-size:13.5px;font-weight:450;transition:background .15s,color .15s;border:1px solid transparent;width:100%;text-align:left;background:transparent}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav.active{background:var(--accent-soft);color:var(--ink);border-color:rgba(43,240,192,.22)}
.nav.active svg{color:var(--accent)}
.nav svg{width:16px;height:16px;flex:0 0 auto;color:var(--faint)}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:20px;background:var(--raised);color:var(--dim)}
.nav .badge.red{background:rgba(229,106,98,.15);color:var(--red)}
.side .msi{margin-top:auto;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--surface)}
.side .msi .t{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.side .msi .v{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.side .msi .v b{font-family:var(--mono);font-size:26px;font-weight:600}
.side .msi .track{height:4px;border-radius:2px;background:#20292B;margin-top:8px}
.side .msi .track > i{display:block;height:100%;border-radius:2px;background:var(--amber)}

/* ── MAIN ── */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 22px;flex:0 0 auto;background:rgba(5,9,14,.72);backdrop-filter:blur(8px)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);min-width:0;overflow:hidden}
.crumbs a{color:var(--dim);cursor:pointer}.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 11px;width:280px;transition:border-color .15s;position:relative}
.cmdres{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50;overflow:hidden;max-height:340px;overflow-y:auto}
.cmdr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;font-size:13px;color:var(--ink);border-bottom:1px solid var(--border-soft)}
.cmdr:hover{background:var(--raised)}
.cmdr-sub{font-size:10.5px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.cmdr-empty{padding:11px 13px;font-size:12px;color:var(--faint)}
.cmd:focus-within{border-color:rgba(43,240,192,.4)}
.cmd svg{width:14px;height:14px;color:var(--faint)}
.cmd input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:13px}
.cmd .kbd{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.kimmi-pill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.kimmi-pill .d{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.clock{font-family:var(--mono);font-size:12px;color:var(--ink)}

.view{flex:1;overflow-y:auto;padding:26px 30px 60px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* headers */
.vhead{margin-bottom:22px}
.vhead .ey{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.vhead h1{font-size:26px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.vhead p{color:var(--dim);font-size:14px;margin-top:7px;max-width:70ch;line-height:1.55}

/* cards & grid */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card.click{cursor:pointer;transition:border-color .18s,transform .18s,background .18s}
.card.click:hover{border-color:rgba(43,240,192,.3);transform:translateY(-2px);background:var(--surface2)}
.sec-t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:26px 0 12px}
.sec-t:first-child{margin-top:0}

/* KPI */
.kpi .l{font-size:12px;color:var(--dim)}
.kpi .n{font-size:24px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.kpi .n small{font-size:12px;font-weight:500;color:var(--faint)}
.trend{font-family:var(--mono);font-size:11px;font-weight:600}
.trend.up{color:var(--accent)}.trend.down{color:var(--red)}.trend.flat{color:var(--faint)}
.spark{margin-top:12px}

/* drill card */
.drill{display:flex;align-items:center;gap:14px}
.drill .ic{width:38px;height:38px;border-radius:10px;background:var(--raised);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.drill .ic svg{width:18px;height:18px;color:var(--accent)}
.drill .bd{flex:1;min-width:0}
.drill .bd .dt{font-size:14.5px;font-weight:600}
.drill .bd .ds{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.drill .rt{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.chev{color:var(--faint)}
.miniscore{font-family:var(--mono);font-size:18px;font-weight:600}

/* pills / chips */
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;text-transform:uppercase;border:1px solid var(--border);color:var(--dim)}
.pill.ok{color:var(--accent);border-color:rgba(43,240,192,.3);background:var(--accent-soft)}
.pill.att{color:var(--amber);border-color:rgba(230,166,83,.3)}
.pill.crit{color:var(--red);border-color:rgba(229,106,98,.3)}
.pill.idle{color:var(--faint)}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);margin-bottom:8px}
.trow.tdone{opacity:.5}
.tcheck{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#04110d;margin-top:1px;transition:background .15s}
.tcheck.on{background:var(--accent);border-color:var(--accent)}
.tmain{flex:1;min-width:0}
.ttitle{font-size:13.5px;color:var(--ink);line-height:1.35}
.trow.tdone .ttitle{text-decoration:line-through;color:var(--faint)}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.ttag{font-size:10.5px;color:var(--accent2);border:1px solid rgba(56,182,255,.3);border-radius:10px;padding:2px 8px}
.towner{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.tsrc{font-size:10px;color:var(--faint);font-family:var(--mono);text-transform:uppercase}
.tright{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tbtn{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(43,240,192,.3);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(43,240,192,.16)}
.tdel{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:4px;line-height:1}
.tdel:hover{color:var(--red)}
.tsel{background:var(--raised);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;cursor:pointer}
.tsel:focus{outline:none;border-color:var(--accent)}
.aufv{display:inline-flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px}
.aufv button{background:none;border:none;color:var(--dim);font-size:12.5px;padding:7px 15px;border-radius:7px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.aufv button.on{background:var(--accent-soft);color:var(--ink)}
.ttbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface2)}
.ttbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
.ttbl th{text-align:left;color:var(--faint);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:11px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.ttbl th:hover{color:var(--accent)}
.ttbl th .ar{color:var(--accent);font-size:9px}
.ttbl td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--ink);vertical-align:middle}
.ttbl tr:hover td{background:rgba(255,255,255,.02)}
.ttbl input.cin,.ttbl select.cin{background:transparent;border:1px solid transparent;color:var(--ink);border-radius:6px;padding:4px 5px;font-size:11.5px;font-family:inherit;width:100%;cursor:pointer}
.ttbl input.cin:hover,.ttbl select.cin:hover{border-color:var(--border)}
.ttbl input.cin:focus,.ttbl select.cin:focus{outline:none;border-color:var(--accent);background:var(--raised)}
.ttbl input.dcin{font-family:var(--mono);font-size:11px}
.tl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface2);padding-bottom:2px}
.tl-row{display:grid;grid-template-columns:190px 1fr;border-top:1px solid var(--border-soft)}
.tl-row.head{border-top:none;position:sticky;top:0;background:var(--surface2);z-index:2}
.tl-lab{padding:11px 12px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border)}
.tl-lab.h{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono)}
.tl-track{position:relative;min-height:40px}
.tl-cells{position:absolute;inset:0;display:grid}
.tl-cells>div{border-left:1px solid var(--border-soft)}
.tl-cells>div.now{background:rgba(43,240,192,.07)}
.tl-hd{display:grid;min-width:640px}
.tl-hd>div{border-left:1px solid var(--border-soft);padding:9px 8px;font-size:10px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.tl-hd>div.now{color:var(--accent)}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:6px;display:flex;align-items:center;padding:0 9px;font-size:10.5px;color:#04110d;font-weight:600;overflow:hidden;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tl-none{position:absolute;top:50%;transform:translateY(-50%);left:6px;font-size:15px;color:var(--faint)}

/* focus banner */
.focus{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-left:3px solid var(--red);background:var(--surface);border-radius:var(--r);padding:15px 18px;margin-bottom:20px}
.focus .fl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.focus .ft{font-size:15px;font-weight:600}
.focus .fw{font-size:13px;color:var(--dim)}
.focus .fa{margin-left:auto;display:flex;gap:8px}
.btn{font-size:12.5px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--ink)}
.btn.pri{background:var(--accent);color:#04120C;border-color:transparent;font-weight:600}
.btn:hover{border-color:rgba(43,240,192,.4)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:9px 13px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}

/* bars */
.bar{height:5px;border-radius:3px;background:#20292B;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:3px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--border);font-weight:500}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border-soft);color:var(--dim)}
.tbl td.k{color:var(--ink)}
.tbl tr:hover td{background:var(--surface2)}

/* kimmi note */
.knote{display:flex;gap:11px;align-items:flex-start;background:var(--accent-soft);border:1px solid rgba(43,240,192,.2);border-radius:11px;padding:13px 15px;margin-top:16px}
.knote .ki{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#04120C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:0 0 auto}
.knote .kt{font-size:13px;color:var(--ink);line-height:1.5}
.knote .kt b{color:var(--accent)}

/* agent row */
.arow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:11px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.arow:hover{border-color:rgba(43,240,192,.3)}
.arow .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dot.idle{background:var(--faint)}
.dot.blocked{background:var(--amber)}
.arow .an{font-weight:600;font-size:14px}
.arow .ad{font-size:12.5px;color:var(--dim);margin-top:2px}
.arow .stat{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--dim)}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--border)}
.tl{position:relative;padding:9px 0}
.tl::before{content:"";position:absolute;left:-19px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl.pend::before{background:var(--faint)}
.tl .tt{font-size:13.5px;color:var(--ink)}
.tl .ts{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}

/* kimmi chat */
.chat{max-width:760px}
.msg{display:flex;gap:12px;margin-bottom:16px}
.msg .av{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.msg.k .av{background:var(--accent);color:#04120C}
.msg.u .av{background:var(--raised);color:var(--dim)}
.msg .bub{font-size:14px;line-height:1.6;color:var(--ink);padding-top:3px}
.msg .bub b{color:var(--accent)}

.crumbs svg{width:12px;height:12px;vertical-align:middle}
/* weekplan */
.week{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;min-height:210px}
.day.today{border-color:rgba(43,240,192,.4);background:var(--surface2)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.day .dh .wd{font-size:12.5px;font-weight:600}
.day .dh .dt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.day.today .dh .wd{color:var(--accent)}
.blk{border-left:2px solid var(--bc,var(--accent));background:var(--raised);border-radius:6px;padding:7px 9px;margin-bottom:7px}
.blk .bt{font-family:var(--mono);font-size:10px;color:var(--faint)}
.blk .bn{font-size:12.5px;color:var(--ink);margin-top:2px;line-height:1.3}
.bo{display:inline-block;font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:4px;margin-top:6px;letter-spacing:.04em}
.bo.K{background:rgba(99,160,217,.15);color:#8FBEE6}
.bo.M{background:rgba(230,120,180,.15);color:#E89AC4}
.bo.G{background:var(--accent-soft);color:var(--accent)}
/* routine session */
.sess{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s}
.sess:hover{border-color:rgba(43,240,192,.3)}
.sess.on{background:var(--surface2)}
.sess .cb{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#04120C;font-size:12px;font-weight:800}
.sess.on .cb{background:var(--accent);border-color:var(--accent)}
.sess .st2{flex:1;font-size:13.5px;color:var(--ink)}
.sess.on .st2{color:var(--faint);text-decoration:line-through}
.sess .mn{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
/* universal input / editable */
.addnew{display:flex;align-items:center;gap:6px;background:var(--accent);color:#04120C;border:0;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;flex:0 0 auto}
.addnew:hover{filter:brightness(1.08)}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--ink);font-size:13.5px;outline:none;font-family:var(--sans)}
.addrow input::placeholder{color:var(--faint)}
.addrow input:focus{border-color:var(--line-hot)}
.uitem{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:9px;background:var(--surface);margin-bottom:8px}
.uitem span{flex:1;font-size:13.5px;color:var(--ink)}
.uidel{background:transparent;border:0;color:var(--faint);font-size:13px;padding:2px 6px}
.uidel:hover{color:var(--red)}
.empty{border:1px dashed var(--border);border-radius:11px;padding:20px;text-align:center;color:var(--faint);font-size:13px;line-height:1.5}
/* lebendiger Organismus — dezentes Atmen (Bioluminescence) */
.main{position:relative}
.main::before{content:"";position:absolute;top:-8%;left:50%;transform:translateX(-50%);width:58%;height:38%;background:radial-gradient(ellipse,rgba(43,240,192,.06),transparent 70%);filter:blur(52px);pointer-events:none;z-index:0;animation:ambient 8s ease-in-out infinite}
.topbar,.view{position:relative;z-index:1}
@keyframes lifepulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.62}}
@keyframes logobreath{0%,100%{box-shadow:0 0 12px rgba(43,240,192,.26)}50%{box-shadow:0 0 26px rgba(43,240,192,.6)}}
@keyframes ambient{0%,100%{opacity:.4}50%{opacity:.85}}
.kimmi-pill .d{animation:lifepulse 3.6s ease-in-out infinite}

function vTimeline(){
