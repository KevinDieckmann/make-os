# ─── MAKE OS auf dem Server ─────────────────────────────────────────────────
# app      — die Oberfläche und alle Schnittstellen (next start, Port 3000 intern)
# arbeiter — der Takt: holt jede Minute fällige Läufe (Tagesstart, Head of Finance …)
# caddy    — HTTPS von allein (Let's Encrypt) für MAKE_OS_DOMAIN, app.makeinnovation.de und makeinnovation.de (+ www)
#
# Ordner auf dem Server (server-einrichten.sh legt sie an):
#   /srv/make-os/daten   → .data   (alles, was ihr eingebt)
#   /srv/make-os/vault   → Obsidian-Hirn (privates Git-Repo, vault-abgleich.sh)
#   /srv/make-os/grabsteine → Grabsteine gelöschter Personen (Art. 17), AUSSERHALB der Daten — ein Restore des
#                          Datenordners holt sie nie zurück (lib/datenschutz/grabsteine.ts, 0700, Besitzer make)
# Geheimnisse stehen in /srv/make-os/app/.env (Vorlage: deploy/env.server.beispiel).

# Härtung (26.09.): kein Rechte-Zuwachs im Container, keine Kernel-Fähigkeiten, Speichergrenzen;
# der Arbeiter bekommt nur den Dienstschlüssel — nicht die iCloud-/Telegram-/Anthropic-Geheimnisse.
x-haertung: &haertung
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
# Log-Rotation (27.09., Sicherheit): Docker behält je Dienst 3 × 10 MB — sonst füllen die Logs irgendwann die Platte.
x-logs: &logs
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  app:
    <<: [*haertung, *logs]
    build: .
    image: make-os:aktuell
    restart: unless-stopped
    # 27.09.: Summe der Grenzen (1280 + 384 + 128 = 1792 MB) bleibt unter den 2 GB des Servers — vorher 2304 MB.
    mem_limit: 1280m
    # Geordnetes Beenden (29.09., Paket D-A #16): Docker wartet bis zu 60 s statt 10 s, bevor es hart abbricht —
    # laufende Mehr-Bestand-Vorgänge (Import, Art. 17, Angebot) werden fertig; ab +20 s lehnt die Datenschicht
    # neue Schreibungen mit 503 ab (lib/store/betrieb.ts), danach verschwindet das Lockfile .schreiber.
    stop_grace_period: 60s
    env_file: .env
    environment:
      PORT: "3000"
      TZ: Europe/Berlin
      # Datenschlüssel als Datei statt in der Umgebung (29.09., #50): /srv/make-os/schluessel/daten (0400, Besitzer make) gilt,
      # sobald MAKE_OS_DATEN_SCHLUESSEL NICHT mehr in der .env steht (Umstellung: NOTFALL.md). daten-alt = alter Schlüssel,
      # nur während einer Rotation im laufenden Betrieb (nur lesen, scripts/datenschluessel-rotieren-live.mjs).
      MAKE_OS_DATEN_SCHLUESSEL_DATEI: /run/make-os-schluessel/daten
      MAKE_OS_DATEN_SCHLUESSEL_ALT_DATEI: /run/make-os-schluessel/daten-alt
      MAKE_OS_INTERN: http://localhost:3000
      MAKE_VAULT_DIR: /vault
      # Brain-Embeddings (27.09.): Modell-Cache außerhalb der Daten (nicht in jeder Sicherung); MAKE_OS_EMBEDDINGS=aus schaltet auf reinen Volltext.
      MAKE_OS_MODELLE_DIR: /modelle
      # Grabsteine (29.09., Paket D-B/D-C): eigenes Volume neben den Daten. Nur die App braucht sie (Art. 17, Löschfristen-
      # Lauf, Restore); der Arbeiter spricht nur HTTP mit der App und bekommt das Volume bewusst NICHT.
      MAKE_OS_GRABSTEINE_DIR: /grabsteine
    volumes:
      - ${MAKE_OS_DATEN:-/srv/make-os/daten}:/app/.data
      - ${MAKE_OS_VAULT:-/srv/make-os/vault}:/vault
      - ${MAKE_OS_MODELLE:-/srv/make-os/modelle}:/modelle
      - ${MAKE_OS_SCHLUESSEL:-/srv/make-os/schluessel}:/run/make-os-schluessel:ro
      - ${MAKE_OS_GRABSTEINE:-/srv/make-os/grabsteine}:/grabsteine
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/anmelden').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  arbeiter:
    <<: [*haertung, *logs]
    image: make-os:aktuell
    restart: unless-stopped
    mem_limit: 384m
    command: ["node", "worker.mjs"]
    environment:
      TZ: Europe/Berlin
      MAKE_OS_URL: http://app:3000
      MAKE_OS_KEY: ${MAKE_OS_KEY}
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    mem_limit: 128m
    ports: ["80:80", "443:443"]
    environment:
      MAKE_OS_DOMAIN: ${MAKE_OS_DOMAIN}
    volumes:
      # Ein Ordner statt einer Datei: git ersetzt Dateien beim Aktualisieren — eine einzeln
      # eingebundene Datei sähe der Container dann nicht (Caddy läse die alte Fassung).
      - ./deploy/caddy:/etc/caddy:ro
      # Landingpage der MAKE Innovation GmbH (01.10.): statische Dateien aus dem Repo-Ordner website/ — compose läuft
      # in /srv/make-os/app, „./website“ ist also /srv/make-os/app/website (kommt mit `ausrollen.sh ziehen`). Nur lesen.
      # Ausgeliefert wird sie erst mit der Freigabe-Fassung der Caddyfile; bis dahin leitet makeinnovation.de um.
      - ./website:/srv/website:ro
      # Event-Seite „Fokus Innovation“ (04.10.): statische Dateien aus fokus/ — nur lesen, wie website/.
      - ./fokus:/srv/fokus:ro
      - caddy_daten:/data
      - caddy_konfig:/config
    depends_on: [app]

volumes:
  caddy_daten:
  caddy_konfig:
