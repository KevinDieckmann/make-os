# ─── MAKE OS auf dem Server ─────────────────────────────────────────────────
# app      — die Oberfläche und alle Schnittstellen (next start, Port 3000 intern)
# arbeiter — der Takt: holt jede Minute fällige Läufe (Tagesstart, Head of Finance …)
# caddy    — HTTPS von allein (Let's Encrypt) für MAKE_OS_DOMAIN
#
# Ordner auf dem Server (server-einrichten.sh legt sie an):
#   /srv/make-os/daten   → .data   (alles, was ihr eingebt)
#   /srv/make-os/vault   → Obsidian-Hirn (privates Git-Repo, vault-abgleich.sh)
# Geheimnisse stehen in /srv/make-os/app/.env (Vorlage: deploy/env.server.beispiel).

# Härtung (26.09.): kein Rechte-Zuwachs im Container, keine Kernel-Fähigkeiten, Speichergrenzen;
# der Arbeiter bekommt nur den Dienstschlüssel — nicht die iCloud-/Telegram-/Anthropic-Geheimnisse.
x-haertung: &haertung
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  app:
    <<: *haertung
    build: .
    image: make-os:aktuell
    restart: unless-stopped
    mem_limit: 1536m
    env_file: .env
    environment:
      PORT: "3000"
      TZ: Europe/Berlin
      MAKE_OS_INTERN: http://localhost:3000
      MAKE_VAULT_DIR: /vault
    volumes:
      - ${MAKE_OS_DATEN:-/srv/make-os/daten}:/app/.data
      - ${MAKE_OS_VAULT:-/srv/make-os/vault}:/vault
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/anmelden').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  arbeiter:
    <<: *haertung
    image: make-os:aktuell
    restart: unless-stopped
    mem_limit: 512m
    command: ["node", "worker.mjs"]
    environment:
      TZ: Europe/Berlin
      MAKE_OS_URL: http://app:3000
      MAKE_OS_KEY: ${MAKE_OS_KEY}
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    ports: ["80:80", "443:443"]
    environment:
      MAKE_OS_DOMAIN: ${MAKE_OS_DOMAIN}
    volumes:
      # Ein Ordner statt einer Datei: git ersetzt Dateien beim Aktualisieren — eine einzeln
      # eingebundene Datei sähe der Container dann nicht (Caddy läse die alte Fassung).
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_daten:/data
      - caddy_konfig:/config
    depends_on: [app]

volumes:
  caddy_daten:
  caddy_konfig:
